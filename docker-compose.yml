services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vekinbox
      POSTGRES_PASSWORD: vekinbox
      POSTGRES_DB: vekinbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vekinbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"
      - "1025:1025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment: &app_env
      DATABASE_URL: postgresql://vekinbox:vekinbox@postgres:5432/vekinbox
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      PORT: 3001
      WEB_URL: http://localhost:3001
      SMTP_HOST: mailcatcher
      SMTP_PORT: 1025
      SMTP_FROM: noreply@vekinbox.local
      EMPTY_DB: ${EMPTY_DB:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: vekinbox
      POSTGRES_DB: vekinbox
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/worker-entrypoint.sh"]
    environment:
      <<: *app_env
      EMPTY_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # Web UI is served by the API container when built (apps/web/dist).
  # Uncomment for standalone Vite dev against the API:
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: pnpm --filter @latticeag/vekinbox-web dev --host
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://localhost:3001/v1
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
