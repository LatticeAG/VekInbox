[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vekinbox"
version = "0.1.0"
description = "Python SDK for VekInbox — durable human approval queue for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["vekinbox"]
