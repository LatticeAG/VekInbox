openapi: 3.1.0
info:
  title: VekInbox API
  version: 0.1.0
  description: |
    Durable human approval queue for AI agents.
    Agents authenticate with API keys; reviewers use session cookies.
  license:
    name: MIT

servers:
  - url: http://localhost:3001/v1
    description: Local development
  - url: https://api.vekinbox.latticeag.com/v1
    description: Production

tags:
  - name: auth
    description: Session authentication
  - name: requests
    description: Approval request lifecycle
  - name: workspaces
    description: Workspace management
  - name: agents
    description: Agent API keys
  - name: policies
    description: Escalation policies
  - name: channels
    description: Notification channels

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: vk_live_... or vk_test_...
      description: Agent API key
    SessionCookie:
      type: apiKey
      in: cookie
      name: vekinbox_session
      description: Reviewer session cookie from dev-login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            docs_url:
              type: string
              format: uri

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Request:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        agent_id:
          type: string
        key:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, declined, timed_out, escalated, cancelled, changes_requested]
        priority:
          type: string
          enum: [low, normal, high, critical]
        actions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              label:
                type: string
        timeout_at:
          type: string
          format: date-time
          nullable: true
        resume_webhook_url:
          type: string
          format: uri
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        labels:
          type: array
          items:
            type: string
        resolved_by:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

paths:
  /auth/dev-login:
    post:
      tags: [auth]
      summary: Dev login (OSS)
      description: Create or fetch a user by email and set session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /requests:
    post:
      tags: [requests]
      summary: Create request
      description: Idempotent by workspace_id + key when return_existing is true (default).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, key, title]
              properties:
                workspace_id:
                  type: string
                key:
                  type: string
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high, critical]
                resume_webhook_url:
                  type: string
                  format: uri
                metadata:
                  type: object
                return_existing:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

    get:
      tags: [requests]
      summary: List requests
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
          description: Required when using session auth
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Request list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Request"
                  next_cursor:
                    type: string
                    nullable: true

  /requests/{id}:
    get:
      tags: [requests]
      summary: Get request
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /requests/{id}/actions/{action}:
    post:
      tags: [requests]
      summary: Resolve request
      description: Reviewers only — requires session auth. Agents cannot resolve.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [approve, decline, request_changes]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /requests/{id}/cancel:
    post:
      tags: [requests]
      summary: Cancel request
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Workspace list
    post:
      tags: [workspaces]
      summary: Create workspace
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}/agents:
    get:
      tags: [workspaces]
      summary: List agents
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent list
    post:
      tags: [workspaces]
      summary: Create agent
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Created

  /agents/{id}/keys:
    post:
      tags: [agents]
      summary: Create API key
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                environment:
                  type: string
                  enum: [live, test]
      responses:
        "201":
          description: API key created (key shown once)

  /workspaces/{id}/policies:
    get:
      tags: [policies]
      summary: List escalation policies
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy list
    post:
      tags: [policies]
      summary: Create escalation policy
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created

  /workspaces/{id}/channels:
    get:
      tags: [channels]
      summary: List notification channels
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel list
    post:
      tags: [channels]
      summary: Add notification channel
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
